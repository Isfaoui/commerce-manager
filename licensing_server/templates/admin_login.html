<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Commerce Manager — Admin Login</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0;
           display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    form { background:#1e293b; padding:2rem; border-radius:8px; width:320px; }
    input { width:100%; padding:.6rem; margin:.4rem 0; border-radius:4px; border:1px solid #334155;
            background:#0f172a; color:#e2e8f0; box-sizing:border-box; }
    button { width:100%; padding:.6rem; margin-top:1rem; border:0; border-radius:4px;
             background:#2563eb; color:white; cursor:pointer; }
    #msg { color:#f87171; min-height:1.2em; font-size:.9em; }
  </style>
</head>
<body>
  <form id="loginForm">
    <h2>Admin Login</h2>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <div id="msg"></div>
    <button type="submit">Sign in</button>
  </form>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const resp = await fetch('/api/admin/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email, password}),
      });
      if (resp.ok) {
        window.location.href = '/admin/';
      } else {
        const data = await resp.json();
        document.getElementById('msg').textContent = data.message || 'Login failed.';
      }
    });
  </script>
</body>
</html>
